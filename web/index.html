<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroEffortDocs</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23241c15' width='32' height='32' rx='4'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' fill='%23efe7d6' font-family='Georgia,serif'%3EZ%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="wizard" class="wizard" hidden></div>
  <aside class="sidebar" id="app-sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark">ZED</span>
      <span class="brand-name">ZeroEffortDocs</span>
    </a>
    <nav>
      <a href="#/" data-nav="home">Обзор</a>
      <div class="nav-block">
        <div class="nav-row">
          <a href="#/templates" data-nav="templates">Шаблоны</a>
          <button type="button" class="nav-caret" data-toggle="templates" aria-label="показать шаблоны">▾</button>
        </div>
        <div class="nav-sub" id="nav-templates" hidden></div>
      </div>
      <div class="nav-block">
        <div class="nav-row">
          <a href="#/documents" data-nav="documents">Документы</a>
          <button type="button" class="nav-caret" data-toggle="documents" aria-label="показать документы">▾</button>
        </div>
        <div class="nav-sub" id="nav-documents" hidden></div>
      </div>
    </nav>
    <div class="sidebar-foot">
      <a href="#/settings" data-nav="settings">Настройки</a>
      <p class="muted" id="company-name"></p>
    </div>
  </aside>
  <main id="app-main">
    <header class="top">
      <h1 id="page-title">Обзор</h1>
      <div id="page-actions"></div>
    </header>
    <section id="view">
      <p class="muted">Загрузка…</p>
    </section>
  </main>
  <div id="modal" class="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>ZED нужен JavaScript.</noscript>
  <script src="/app.js"></script>
</body>
</html>
